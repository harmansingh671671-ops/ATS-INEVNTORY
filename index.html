  <script>

      darkMode: 'class',
      theme: {

            'primary-container': '#131b2e', 'on-primary-container': '#7c839b',
            secondary: '#0058be', 'on-secondary': '#ffffff',
            'secondary-container': '#2170e4', 'on-secondary-container': '#fefcff',
            'secondary-fixed': '#d8e2ff', 'on-secondary-fixed-variant': '#004395',
            'primary-fixed': '#dae2fd', 'primary-fixed-dim': '#bec6e0',
            'tertiary-container': '#0b1c30', 'on-tertiary-container': '#75859d',
            surface: '#f7f9fb', 'surface-dim': '#d8dadc', 'surface-bright': '#f7f9fb',
            'surface-container-lowest': '#ffffff', 'surface-container-low': '#f2f4f6',
            'surface-container': '#eceef0', 'surface-container-high': '#e6e8ea',
            'surface-container-highest': '#e0e3e5', 'surface-variant': '#e0e3e5',
            'on-surface': '#191c1e', 'on-surface-variant': '#45464d',
            outline: '#76777d', 'outline-variant': '#c6c6cd',
            error: '#ba1a1a', 'on-error': '#ffffff',
            'error-container': '#ffdad6', 'on-error-container': '#93000a',
            background: '#f7f9fb', 'on-background': '#191c1e'
          },
          fontFamily: {'body-md': ['Inter'], 'display-md': ['Inter'], 'display-lg': ['Inter'], 'label-sm': ['JetBrains Mono'], 'table-data': ['Inter']},
          fontSize: {
            'body-md': ['14px', {lineHeight: '20px'}], 'body-lg': ['16px', {lineHeight: '24px'}],
            'display-md': ['24px', {lineHeight: '32px'}], 'display-lg': ['32px', {lineHeight: '40px'}],
            'table-data': ['13px', {lineHeight: '18px'}], 'label-sm': ['12px', {lineHeight: '16px', letterSpacing: '0.02em'}]
          },
          spacing: {xs: '4px', sm: '8px', md: '16px', lg: '24px', xl: '48px', gutter: '20px', 'container-max': '1440px'}
        }
      }

  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .page-section { display: none; }
    .page-section.active { display: block; }
    body { font-family: 'Inter', sans-serif; }

<body class="bg-surface text-on-surface font-body-md min-h-screen">

  <!-- AUTH VIEW (not signed in) -->
  <div id="auth-view" class="fixed inset-0 z-50 bg-surface hidden items-center justify-center p-md">
    <div class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-xl border border-outline-variant/20 p-lg flex flex-col gap-md">
      <div class="flex flex-col items-center gap-sm pb-sm">
        <div class="w-14 h-14 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
          <span class="material-symbols-outlined text-[28px]">inventory_2</span>
        </div>
        <h1 class="font-display-lg text-display-lg text-primary">ATS CLUB</h1>
        <p class="text-on-surface-variant text-sm -mt-sm">Equipment &amp; Inventory Management</p>
      </div>
      <div id="auth-alert" class="hidden text-sm px-md py-sm rounded-lg bg-error-container text-on-error-container"></div>
      <div class="flex bg-surface-container rounded-full p-xs">
        <button id="auth-tab-login" onclick="Auth.switchTab('login')" class="flex-1 py-sm rounded-full font-label-sm transition-all">Sign In</button>
        <button id="auth-tab-signup" onclick="Auth.switchTab('signup')" class="flex-1 py-sm rounded-full font-label-sm transition-all">Sign Up</button>
      </div>
      <form id="auth-form" class="flex flex-col gap-md" onsubmit="Auth.handleSubmit(event)">
        <div id="auth-name-field" class="hidden">
          <label class="font-label-sm text-label-sm text-on-surface-variant mb-xs block">Full Name</label>
          <input id="auth-name" type="text" class="w-full bg-surface-bright border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20" placeholder="Alex Morgan">
        </div>
        <div>
          <label class="font-label-sm text-label-sm text-on-surface-variant mb-xs block">Email Address</label>
          <input id="auth-email" type="email" required class="w-full bg-surface-bright border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20" placeholder="member@atsclub.com">
        </div>
        <div>
          <label class="font-label-sm text-label-sm text-on-surface-variant mb-xs block">Password</label>
          <input id="auth-password" type="password" required minlength="6" class="w-full bg-surface-bright border border-outline-variant rounded-lg px-md py-sm focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20" placeholder="••••••••">
        </div>
        <button id="auth-submit-btn" type="submit" class="w-full bg-secondary text-on-secondary py-sm rounded-lg font-label-sm hover:bg-on-secondary-fixed-variant transition-colors flex items-center justify-center gap-sm">
          <span class="material-symbols-outlined text-[18px]">login</span>
          <span>Sign In</span>
        </button>
      </form>
      <p class="text-center text-sm text-on-surface-variant">New members start as <strong class="text-on-surface">Member</strong>. Admins are granted via SQL.</p>
    </div>
  </div>

  <!-- APP VIEW (rendered by app.js - replaces innerHTML) -->
  <div id="app-view" class="hidden min-h-screen flex flex-col"></div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-lg right-lg z-[100] flex flex-col gap-sm"></div>

  <!-- Modal container -->
  <div id="modal-container" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-[200]"></div>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
