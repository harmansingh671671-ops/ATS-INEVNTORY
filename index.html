            'primary-fixed': '#dae2fd', 'primary-fixed-dim': '#bec6e0',
            'tertiary-container': '#0b1c30', 'on-tertiary-container': '#75859d',
            surface: '#f7f9fb', 'surface-dim': '#d8dadc', 'surface-bright': '#f7f9fb',
            'surface-container-lowest': '#ffffff', 'surface-container-low': '#f2f4f6',
            'surface-container': '#eceef0', 'surface-container-high': '#e6e8ea',

<body class="bg-surface text-on-surface font-body-md min-h-screen">

  <!-- AUTH VIEW (not signed in) -->
  <div id="auth-view" class="fixed inset-0 z-50 hidden items-center justify-center bg-[radial-gradient(circle_at_top,_#ecf3ff_0%,_#f7f9fb_35%,_#eef2f6_100%)] p-md">
    <div class="w-full max-w-md rounded-3xl border border-primary/10 bg-surface-container-lowest p-lg shadow-[0_20px_60px_rgba(0,0,0,0.12)] ring-1 ring-secondary/5 flex flex-col gap-md">
      <div class="flex flex-col items-center gap-sm pb-sm">
        <div class="flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-secondary/90 to-primary text-white shadow-lg shadow-secondary/20">
          <span class="material-symbols-outlined text-[28px]">inventory_2</span>
        </div>
        <h1 class="font-display-lg text-display-lg text-primary">ATS CLUB</h1>
        <p class="-mt-sm text-sm text-on-surface-variant">Equipment &amp; Inventory Management</p>
      </div>
      <div id="auth-alert" class="hidden rounded-lg bg-error-container px-md py-sm text-sm text-on-error-container"></div>
      <div class="flex rounded-full bg-surface-container p-xs">
        <button id="auth-tab-login" onclick="Auth.switchTab('login')" class="flex-1 rounded-full py-sm font-label-sm transition-all">Sign In</button>
        <button id="auth-tab-signup" onclick="Auth.switchTab('signup')" class="flex-1 rounded-full py-sm font-label-sm transition-all">Sign Up</button>
      </div>
      <form id="auth-form" class="flex flex-col gap-md" onsubmit="Auth.handleSubmit(event)">
        <div id="auth-name-field" class="hidden">
          <label class="mb-xs block font-label-sm text-label-sm text-on-surface-variant">Full Name</label>
          <input id="auth-name" type="text" class="w-full rounded-lg border border-outline-variant bg-surface-bright px-md py-sm shadow-sm transition focus:border-secondary focus:outline-none focus:ring-2 focus:ring-secondary/20" placeholder="Alex Morgan">
        </div>
        <div>
          <label class="mb-xs block font-label-sm text-label-sm text-on-surface-variant">Email Address</label>
          <input id="auth-email" type="email" required class="w-full rounded-lg border border-outline-variant bg-surface-bright px-md py-sm shadow-sm transition focus:border-secondary focus:outline-none focus:ring-2 focus:ring-secondary/20" placeholder="member@atsclub.com">
        </div>
        <div>
          <label class="mb-xs block font-label-sm text-label-sm text-on-surface-variant">Password</label>
          <input id="auth-password" type="password" required minlength="6" class="w-full rounded-lg border border-outline-variant bg-surface-bright px-md py-sm shadow-sm transition focus:border-secondary focus:outline-none focus:ring-2 focus:ring-secondary/20" placeholder="••••••••">
        </div>
        <button id="auth-submit-btn" type="submit" class="flex w-full items-center justify-center gap-sm rounded-lg bg-gradient-to-r from-secondary to-primary py-sm font-label-sm text-on-secondary shadow-md shadow-secondary/20 transition hover:brightness-105">
          <span class="material-symbols-outlined text-[18px]">login</span>
          <span>Sign In</span>
        </button>
      </form>
      <p class="text-center text-sm text-on-surface-variant">New members start as <strong class="text-on-surface">Member</strong>. Admins are granted via SQL.</p>
    </div>
  </div>

  <!-- APP VIEW (rendered by app.js - replaces innerHTML) -->
  <div id="app-view" class="hidden min-h-screen flex flex-col"></div>

  <!-- Install prompt for supported mobile browsers -->
  <div id="install-banner" class="hidden fixed bottom-4 left-4 right-4 z-[150] rounded-xl border border-secondary/20 bg-surface-container-lowest p-md shadow-[0_12px_40px_rgba(0,0,0,0.18)]">
    <div class="flex items-start gap-sm">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-secondary text-on-secondary">
        <span class="material-symbols-outlined">install_mobile</span>
      </div>
      <div class="min-w-0 flex-1">
        <div class="font-bold text-primary">Install ATS CLUB</div>
        <p id="install-banner-message" class="mt-1 text-xs text-on-surface-variant">Install the app for quicker access from your phone.</p>
      </div>
      <button type="button" onclick="App.dismissInstallBanner()" class="shrink-0 p-1 text-on-surface-variant" aria-label="Dismiss install prompt">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>
    <button id="install-banner-action" type="button" onclick="App.installApp()" class="mt-sm w-full rounded-lg bg-secondary px-md py-sm text-sm font-bold text-on-secondary">Install App</button>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-lg right-lg z-[100] flex flex-col gap-sm"></div>

  <!-- Modal container -->
  <div id="modal-container" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 hidden z-[200]"></div>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
