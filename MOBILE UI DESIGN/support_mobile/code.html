</head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased md:hidden pb-[80px]">
<!-- Top Navigation (Mobile Version - Minimal) -->
<header class="sticky top-0 w-full z-50 bg-surface-container-lowest border-b border-outline-variant shadow-[0px_4px_12px_rgba(15,23,42,0.05)] h-16 flex items-center px-md justify-between">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer active:opacity-80 transition-opacity" data-icon="arrow_back">arrow_back</span>
<h1 class="font-display-md text-display-md text-primary">Support</h1>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-variant flex-shrink-0">
<img alt="Member Profile" class="w-full h-full object-cover" data-alt="A clean, professional close-up portrait of a modern office worker serving as a generic avatar. The lighting is bright and even, casting soft shadows. The background is a minimalist, light gray corporate setting. The overall mood is approachable, efficient, and fits perfectly within a light-mode data management dashboard interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBSl5w335Dv10gC3LdDlVebWmUtyDBHDarGZIIgprHFtOEo3gJYClJQYTRE8ohZLvA_TkvqCMPXfMxGCQt53ZvxPIJ4lqcr4p_RL_Sr9vZ3xfOQnpzUlj8w7F9tYpencMTan5PdyFCPJ-tSI1QNhcNo5E8Y2BgtqkI-LKmhWMq2IxR_1n7tG5734S59wfMerxuOGjAeO3IjXM63ir93usrZS23Zpwk2ih1FSzINuFTEJCJvLq1BOV0g1A"/>
</div>
</header>
<main class="p-md flex flex-col gap-lg">
<!-- Search Section -->
<section class="flex flex-col gap-sm">
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full pl-[36px] pr-sm py-sm rounded border border-outline-variant bg-surface-container-lowest focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="How can we help you?" type="text"/>
</div>
</section>
<!-- Quick Links (Bento Grid Style) -->
<section>
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-sm">Quick Solutions</h2>
<div class="grid grid-cols-2 gap-md">
<!-- Card 1 -->
<div class="bg-surface-container-lowest p-md rounded-lg shadow-[0px_4px_12px_rgba(15,23,42,0.05)] active:scale-[0.98] transition-transform flex flex-col gap-sm cursor-pointer border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-2xl" data-icon="inventory_2">inventory_2</span>
<span class="font-body-md text-body-md font-semibold text-on-surface">Inventory Setup</span>
</div>
<!-- Card 2 -->
<div class="bg-surface-container-lowest p-md rounded-lg shadow-[0px_4px_12px_rgba(15,23,42,0.05)] active:scale-[0.98] transition-transform flex flex-col gap-sm cursor-pointer border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-2xl" data-icon="sync_problem">sync_problem</span>
<span class="font-body-md text-body-md font-semibold text-on-surface">Sync Issues</span>
</div>
<!-- Card 3 -->
<div class="bg-surface-container-lowest p-md rounded-lg shadow-[0px_4px_12px_rgba(15,23,42,0.05)] active:scale-[0.98] transition-transform flex flex-col gap-sm cursor-pointer border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-2xl" data-icon="group">group</span>
<span class="font-body-md text-body-md font-semibold text-on-surface">Manage Members</span>
</div>
<!-- Card 4 -->
<div class="bg-surface-container-lowest p-md rounded-lg shadow-[0px_4px_12px_rgba(15,23,42,0.05)] active:scale-[0.98] transition-transform flex flex-col gap-sm cursor-pointer border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-2xl" data-icon="description">description</span>
<span class="font-body-md text-body-md font-semibold text-on-surface">Billing &amp; Reports</span>
</div>
</div>
</section>
<!-- Submit Ticket Form -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(15,23,42,0.05)] p-md border border-outline-variant/30">
<div class="flex items-center gap-sm mb-md pb-sm border-b border-outline-variant">
<span class="material-symbols-outlined text-secondary" data-icon="support_agent">support_agent</span>
<h2 class="font-display-md text-display-md text-on-surface !text-[18px]">Submit a Ticket</h2>
</div>
<form class="flex flex-col gap-md">
<!-- Issue Type Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Issue Type</label>
<div class="relative">
<select class="w-full appearance-none rounded border border-tertiary bg-surface-container-lowest py-sm pl-sm pr-[36px] focus:border-secondary focus:ring-0 outline-none transition-colors font-body-md text-body-md text-on-surface">
<option disabled="" selected="" value="">Select category...</option>
<option value="hardware">Hardware / Scanner Issue</option>
<option value="software">Software Bug / Glitch</option>
<option value="account">Account Access</option>
<option value="data">Data Discrepancy</option>
<option value="other">Other</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Urgency Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Urgency</label>
<div class="relative">
<select class="w-full appearance-none rounded border border-tertiary bg-surface-container-lowest py-sm pl-sm pr-[36px] focus:border-secondary focus:ring-0 outline-none transition-colors font-body-md text-body-md text-on-surface">
<option value="low">Low - General Question</option>
<option value="medium">Medium - Hindering workflow</option>
<option value="high">High - System completely blocked</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase">Description</label>
<textarea class="w-full rounded border border-tertiary bg-surface-container-lowest p-sm focus:border-secondary focus:ring-0 outline-none transition-colors font-body-md text-body-md text-on-surface resize-none" placeholder="Please describe the issue in detail..." rows="4"></textarea>
</div>
<!-- Attachment (Optional) -->
<div class="flex items-center gap-sm">
<button class="flex items-center gap-xs px-sm py-xs rounded border border-tertiary text-on-surface bg-transparent hover:bg-surface-variant transition-colors font-body-md text-body-md text-[13px]" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="attach_file">attach_file</span>
                        Attach Screenshot
                    </button>
<span class="text-[12px] text-on-surface-variant italic">Optional (Max 5MB)</span>
</div>
<!-- Submit Button -->
<button class="mt-sm w-full bg-secondary text-on-secondary font-body-md text-body-md font-semibold py-sm rounded flex items-center justify-center gap-xs active:scale-[0.98] transition-transform" type="submit">
<span>Submit Request</span>
<span class="material-symbols-outlined text-[18px]" data-icon="send">send</span>
</button>
</form>
</section>
</main>
</body></html>
